[project]
name = "commeet"
version = "0.1.0"
description = "Commeet - POSTECH CSE Time Scheduler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "gunicorn>=26.1.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "motor>=3.7.1",
    "pydantic[email]>=2.13.4",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    # MONGO_SSH_TUNNEL=true일 때만 import 됩니다 (app/db/mongo.py).
    # paramiko 4.0이 DSSKey를 없앴는데 sshtunnel 0.4.0은 아직 그걸
    # 참조합니다 (AttributeError: module 'paramiko' has no attribute
    # 'DSSKey'). sshtunnel이 고쳐질 때까지 3.x에 묶어 둡니다.
    "sshtunnel>=0.4.0",
    "paramiko<4",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
