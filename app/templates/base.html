<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Sets the theme before first paint, so there's no flash of the wrong
      // palette. Must run here, before the stylesheet link below, not from
      // ui.js (which only loads at the end of <body>). A user's explicit
      // choice (localStorage) always wins; otherwise this falls back to the
      // OS preference, which the stylesheet's @media query also honors on
      // its own even if this script doesn't run (e.g. JS disabled).
      (function () {
        try {
          var stored = localStorage.getItem("pcts_theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage unavailable (private mode, etc.) - CSS's own
             prefers-color-scheme fallback still applies */
        }
      })();
    </script>
    <title>{% block title %}{{ APP_NAME }} - {{ APP_FULL_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block description %}모두의 가능한 시간을 한눈에 모아 그룹 일정을 빠르게 조율하세요.{% endblock %}" />
    <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include "partials/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% block footer %}{% include "partials/footer.html" %}{% endblock %}
    <div id="snackbar-root"></div>
    <script src="{{ asset('js/api.js') }}"></script>
    <script src="{{ asset('js/ui.js') }}"></script>
    {# 여러 사람이 함께 보는 화면의 자동 갱신 루프. 페이지 스크립트보다
       먼저 있어야 createLiveRefresh()를 쓸 수 있습니다. #}
    <script src="{{ asset('js/live.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
