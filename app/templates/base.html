<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ APP_NAME }} - {{ APP_FULL_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block description %}모두의 가능한 시간을 한눈에 모아 그룹 일정을 빠르게 조율하세요.{% endblock %}" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c80150'/%3E%3Ctext x='50' y='69' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EP%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include "partials/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% block footer %}{% include "partials/footer.html" %}{% endblock %}
    <div id="snackbar-root"></div>
    <script src="{{ asset('js/api.js') }}"></script>
    <script src="{{ asset('js/ui.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
