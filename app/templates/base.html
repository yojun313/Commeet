<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일: 입력 포커스 확대 금지 + 노치까지 화면 사용 + (안드로이드)
         키보드가 올라오면 레이아웃 축소. safe-area 여백은 style.css에서. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // Sets the theme before first paint, so there's no flash of the wrong
      // palette. Must run here, before the stylesheet link below, not from
      // ui.js (which only loads at the end of <body>). A user's explicit
      // choice (localStorage) always wins; otherwise this falls back to the
      // OS preference, which the stylesheet's @media query also honors on
      // its own even if this script doesn't run (e.g. JS disabled).
      (function () {
        try {
          var stored = localStorage.getItem("pcts_theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage unavailable (private mode, etc.) - CSS's own
             prefers-color-scheme fallback still applies */
        }
      })();
    </script>
    <title>{% block title %}{{ APP_NAME }} - {{ APP_FULL_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block description %}모두의 가능한 시간을 한눈에 모아 그룹 일정을 빠르게 조율하세요.{% endblock %}" />
    <!-- 홈 화면 앱(PWA). apple-* 메타와 아이콘은 "홈 화면에 추가"하는 순간
         한 번만 읽히므로, 바꾸면 아이콘을 지우고 다시 추가해야 반영됩니다. -->
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Commeet" />
    <meta name="application-name" content="Commeet" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151b" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include "partials/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% block footer %}{% include "partials/footer.html" %}{% endblock %}
    <div id="snackbar-root"></div>
    <script>window.PROFESSOR_FEATURES = {{ "true" if user and user.professorFeatures else "false" }};</script>
    <script src="{{ asset('js/api.js') }}"></script>
    <script src="{{ asset('js/ui.js') }}"></script>
    {# 여러 사람이 함께 보는 화면의 자동 갱신 루프. 페이지 스크립트보다
       먼저 있어야 createLiveRefresh()를 쓸 수 있습니다. #}
    <script src="{{ asset('js/live.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
