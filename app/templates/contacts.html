{% extends "base.html" %}
{% block title %}연락처 - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="container" style="padding-bottom: 60px;">
  <h1 style="margin-top: 32px; margin-bottom: 4px;">연락처</h1>
  <p>일정에 자주 초대하는 사람을 저장해 두세요. 가입하지 않은 사람도 추가할 수 있습니다.</p>

  <div class="contacts-layout">
  <div class="contacts-side">
  <div class="card card-pad" style="margin-bottom: 16px;">
    {% include "partials/contact_add_panel.html" %}
  </div>

  <div class="card card-pad" id="contact-filters" style="display: none;"></div>
  </div>

  <div class="contacts-main">
    <div class="contacts-main-head">
      <h2 style="font-size: 15px; margin: 0;">저장된 연락처 (<span id="contact-count">0</span>)</h2>
      <select class="input list-sort-select" id="contact-sort-select" aria-label="정렬"></select>
      <div class="toggle-group" id="contact-view-toggle" aria-label="보기 방식">
        <button type="button" data-view="grid">그리드</button>
        <button type="button" data-view="list">리스트</button>
      </div>
    </div>
    <div class="contacts-select-bar">
      <label class="checkbox-row contacts-select-all">
        <input type="checkbox" id="contact-select-all" />
        <span class="checkbox-copy">전체 선택</span>
      </label>
      <span class="hint" id="contact-selected-count">0개 선택됨</span>
      <span class="hint contacts-select-hint" id="contact-select-hint"></span>
      <button class="btn btn-ghost btn-sm contacts-delete-selected"
              type="button" id="contact-delete-selected" disabled>선택 삭제</button>
    </div>
    <div id="contacts-list"><div class="empty-state"><span class="spinner"></span></div></div>
  </div>
  </div>
</div>

<div class="dialog-backdrop" id="contact-detail-dialog">
  <div class="dialog dialog-sm">
    <div class="dialog-header">
      <h2 id="cd-title">연락처 정보</h2>
      <button class="btn-icon" type="button" data-dialog-close>&times;</button>
    </div>
    <div id="cd-body"></div>
    <div class="dialog-footer">
      <button type="button" class="btn btn-ghost" data-dialog-close>닫기</button>
      <button type="button" class="btn btn-primary" id="cd-edit-btn">수정</button>
    </div>
  </div>
</div>

<div class="dialog-backdrop" id="edit-contact-dialog">
  <div class="dialog dialog-md">
    <div class="dialog-header">
      <h2>연락처 수정</h2>
      <button class="btn-icon" type="button" data-dialog-close>&times;</button>
    </div>
    <form id="edit-contact-form">
      <div class="field">
        <label for="ec-name">이름</label>
        <input class="input" id="ec-name" required />
      </div>
      <div class="field">
        <label for="ec-email">이메일</label>
        <input class="input" type="email" id="ec-email" required />
      </div>

      <div class="ne-columns">
        <div class="ne-col">
          <div class="field">
            <label for="ec-relation">구분</label>
            <input class="input" id="ec-relation" placeholder="예: 지도학생" />
          </div>
          <div class="field">
            <label for="ec-degree">과정</label>
            <select class="input" id="ec-degree"></select>
          </div>
          <div class="field">
            <label for="ec-gradschool">대학원</label>
            <input class="input" id="ec-gradschool" placeholder="예: 일반대학원" />
          </div>
          <div class="field">
            <label for="ec-department">학과</label>
            <input class="input" id="ec-department" placeholder="예: 컴공" />
          </div>
        </div>
        <div class="ne-col">
          <div class="field">
            <label for="ec-year">학년</label>
            <input class="input" id="ec-year" />
          </div>
          <div class="field">
            <label for="ec-semester">학기</label>
            <input class="input" id="ec-semester" />
          </div>
          <div class="field">
            <label for="ec-studentid">학번</label>
            <input class="input" id="ec-studentid" />
          </div>
          <div class="field">
            <label for="ec-status">학적상태</label>
            <select class="input" id="ec-status"></select>
          </div>
          <div class="field">
            <label for="ec-phone">전화번호</label>
            <input class="input" id="ec-phone" placeholder="010-0000-0000" />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="ec-memo">메모</label>
        <textarea class="input" id="ec-memo" rows="2" placeholder="이 사람에 대해 기억해 둘 내용"></textarea>
      </div>

      <p class="form-error" id="edit-contact-error"></p>
      <div class="dialog-footer">
        <button type="button" class="btn btn-ghost" data-dialog-close>취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ asset('js/card-sort.js') }}"></script>
<script src="{{ asset('js/contact-filters.js') }}"></script>
<script src="{{ asset('js/contact-add.js') }}"></script>
<script src="{{ asset('js/contacts.js') }}"></script>
{% endblock %}
