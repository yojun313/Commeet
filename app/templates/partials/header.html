<header class="site-header">
  <div class="container">
    <div class="header-logos">
      <a class="header-logo-left" href="https://www.postech.ac.kr/kor/index.do" target="_blank" rel="noopener">
        <img class="logo-light" src="{{ asset('images/postech-signature.png') }}" alt="POSTECH" />
        <img class="logo-dark" src="{{ asset('images/postech-signature-dark.png') }}" alt="" aria-hidden="true" />
      </a>
      <span class="header-divider"></span>
      <a class="brand" href="{{ '/home' if user else '/' }}">
        <span class="brand-mark">{{ APP_NAME }}</span>
        <span class="brand-sub">{{ APP_FULL_NAME }}</span>
      </a>
    </div>

    <div class="nav-actions">
      <button class="btn-icon theme-toggle-btn" type="button" id="theme-toggle-btn" aria-label="다크 모드 전환">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z"></path>
        </svg>
      </button>
      {% if user %}
        <nav class="nav-links">
          <a href="/home" class="{{ 'active' if request.url.path == '/home' else '' }}">대시보드</a>
          <a href="/calendar" class="{{ 'active' if request.url.path == '/calendar' else '' }}">캘린더</a>
          <a href="/contacts" class="{{ 'active' if request.url.path == '/contacts' else '' }}">연락처</a>
        </nav>
        <div class="user-menu" data-user-menu>
          <button class="user-menu-trigger" type="button" data-user-menu-trigger>
            <span class="avatar sm">{{ (user.name or user.email)[0] | upper }}</span>
            <span class="user-menu-name">{{ user.name or user.email }}</span>
          </button>
          <div class="user-menu-dropdown" data-user-menu-dropdown>
            {% if user.isAdmin %}
            <a href="/admin">관리자 대시보드</a>
            {% endif %}
            <a href="/settings">설정</a>
            <button type="button" data-sign-out>로그아웃</button>
          </div>
        </div>
      {% else %}
        <a class="btn btn-ghost btn-sm" href="/sign-in">로그인</a>
        <a class="btn btn-primary btn-sm" href="/sign-up">시작하기</a>
      {% endif %}
    </div>
  </div>
</header>
