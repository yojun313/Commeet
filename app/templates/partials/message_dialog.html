{# 주최자가 참가자에게 짧은 안내를 보내는 창 (응답 재촉 등).

   초대 창과 나눠 둔 이유: 초대는 "링크를 받아 보세요"이고 이쪽은 "이미 받은
   그 일정에 대한 알림"입니다. 같은 창에 넣으면 이미 응답한 사람에게 다시
   "초대합니다"라고 보내게 됩니다.

   받는 사람은 서버가 응답 여부로 나눠 내려 줍니다 (/mail-targets). #}
<div class="dialog-backdrop" id="message-dialog">
  <div class="dialog dialog-md">
    <div class="dialog-header">
      <h2>메일 보내기</h2>
      <button class="btn-icon" type="button" data-dialog-close>&times;</button>
    </div>

    <p class="hint" style="margin-top: 0;">
      고른 사람에게 짧은 안내를 보냅니다. 일정 링크는 자동으로 함께 나갑니다.
    </p>

    <div class="field">
      <div id="msg-targets" class="invite-contact-list">
        <p class="hint" style="margin: 0;">불러오는 중...</p>
      </div>
    </div>

    <div class="field">
      <label for="msg-subject">제목 (선택)</label>
      <input class="input" id="msg-subject" maxlength="200"
             placeholder="비우면 &quot;[Commeet] '일정 이름' 안내&quot;로 나갑니다" />
    </div>

    <div class="field">
      <label class="checkbox-row">
        <input type="checkbox" id="msg-combined" checked />
        <span class="checkbox-copy">
          하나의 메일로 발송
          <div class="desc">전체 수신자를 포함한 하나의 메일을 발송하고 나 자신을 참조합니다.</div>
        </span>
      </label>
    </div>

    <div class="field">
      <label for="msg-body">보낼 내용</label>
      <textarea class="input" id="msg-body" rows="4" maxlength="1000"
                placeholder="예: 아직 가능한 시간을 표시하지 않으신 분들은 이번 주 금요일까지 부탁드립니다."></textarea>
    </div>

    <p class="form-error" id="msg-error"></p>

    <div class="dialog-footer">
      <button type="button" class="btn btn-ghost" data-dialog-close>취소</button>
      <button type="button" class="btn btn-primary" id="msg-send-btn">보내기</button>
    </div>
  </div>
</div>
