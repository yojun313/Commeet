<!doctype html>
<meta charset="utf-8" />
<title>Commeet → POVIS</title>
<link rel="stylesheet" href="popup.css" />

<header>
  <h1>Commeet → POVIS <span class="tag">데모</span></h1>
  <button id="settingsToggle" class="icon" title="서버 주소">⚙</button>
</header>

<p class="warn">저장은 하지 않습니다. 값을 채우기만 하며, 실제 반영은 POVIS의 저장 버튼을 직접 누를 때만 일어납니다.</p>

<!-- 서버 주소 -->
<section id="settings" hidden>
  <h2>Commeet 서버</h2>
  <input id="baseUrl" type="url" placeholder="https://commeet.knpu.re.kr" />
  <button id="saveBaseUrl">저장</button>
</section>

<!-- 1. 로그인 -->
<section id="loginView" hidden>
  <h2>Commeet 로그인</h2>
  <input id="email" type="email" placeholder="이메일" autocomplete="username" />
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
  <button id="login" class="primary">로그인</button>
  <p class="hint">비밀번호는 저장하지 않습니다. 로그인 후에는 세션 쿠키만 남습니다.</p>
</section>

<!-- 로그인 상태 -->
<section id="account" hidden>
  <div class="row">
    <span id="who"></span>
    <button id="logout" class="link">로그아웃</button>
  </div>
</section>

<!-- 2. 일정 -->
<section id="eventsView" hidden>
  <h2>내 일정</h2>
  <p class="hint">내가 만든 일정만 보입니다 - 면담 기록은 주최자만 작성합니다.</p>
  <select id="events"></select>
  <button id="loadRecords">면담 기록 불러오기</button>
</section>

<!-- 3. 기록 -->
<section id="recordsView" hidden>
  <h2>면담 기록</h2>
  <select id="records"></select>
  <div id="recordMeta" class="meta"></div>
</section>

<!-- 4. 학생 -->
<section id="studentsView" hidden>
  <h2>학생</h2>
  <select id="students"></select>
  <div id="notes" class="notes"></div>
</section>

<!-- 5. POVIS -->
<section id="povisView" hidden>
  <h2>POVIS</h2>
  <p class="hint" id="mappingHint"></p>
  <button id="fill" class="primary">POVIS에 채우기</button>
  <button id="restore">되돌리기</button>
  <button id="scan">필드 스캔</button>
</section>

<pre id="out" hidden></pre>

<script src="commeet.js"></script>
<script src="povis.js"></script>
<script src="popup.js"></script>
